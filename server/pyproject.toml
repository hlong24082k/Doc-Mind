[project]
name = "server"
version = "0.1.0"
description = "Doc-Mind Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "google-generativeai>=0.8.6",
    "greenlet>=3.1.1",
    "jwt>=1.4.0",
    "loguru>=0.7.3",
    "passlib>=1.7.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.38",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.flake8]
max-line-length = 79
extend-ignore = "E203"
exclude = [".git", "__pycache__", "build", "dist", ".venv", "alembic"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
